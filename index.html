<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Profile card component</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/styles.css">
  <style>

  </style>
</head>

<body>
  <main class="main">
    <div class="top ball"></div>
    <div class="bottom ball"></div>

    <article class="card">
      <div class="card-top"></div>

      <div class="person-info">
        <img src="./images/image-victor.jpg" alt="" class="person-image">

        <div class="age-name">
          <h1 class="person-name">Victor Crest</h1>
          <p class="person-age">26</p>
        </div>

        <p class="person-city">London</p>
      </div>

      <div class="card-stats">
        <div class="stats">
          <span class="stat">80K</span>
          <p class="caption">Followers</p>
        </div>

        <div class="stats">
          <span class="stat">803K</span>
          <p class="caption">Likes</p>
        </div>

        <div class="stats">
          <span class="stat">1.4K</span>
          <p class="caption">Photos</p>
        </div>
      </div>
    </article>

  </main>

  <footer class="footer">
    <p>Challenge by <a class="credit" rel="noopener noreferrer" target="_blank"
        href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.</p>
    <p>Coded by <a class="credit" rel="noopener noreferrer" target="_blank"
        href="https://github.com/arshiya-sr">Arshiya_sr</a>.</p>
  </footer>
</body>

</html>
